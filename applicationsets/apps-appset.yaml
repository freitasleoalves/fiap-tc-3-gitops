apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/freitasleoalves/fiap-tc-3-gitops.git
        revision: HEAD
        directories:
          - path: apps/*/overlays/prod
  template:
    metadata:
      name: 'app-{{ index .path.segments 1 }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/freitasleoalves/fiap-tc-3-gitops.git
        targetRevision: HEAD
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'togglemaster-{{ index .path.segments 1 }}'
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
      # As credenciais reais de Redis/Service Bus/Cosmos DB são aplicadas
      # diretamente no cluster (kubectl), fora do Git, para não expor chaves
      # ativas do Azure num repositório público (o GitHub Push Protection
      # bloqueia esse tipo de commit). O manifesto em secrets.yaml existe só
      # como placeholder/documentação da estrutura esperada do Secret.
      ignoreDifferences:
        - kind: Secret
          name: redis-secrets
          jsonPointers:
            - /stringData
        - kind: Secret
          name: azure-secrets
          jsonPointers:
            - /stringData
