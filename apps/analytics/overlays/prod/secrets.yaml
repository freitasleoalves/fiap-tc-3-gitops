# ATENÇÃO: azure-secrets NÃO é gerenciado por este arquivo. As chaves reais
# do Service Bus/Cosmos DB (Azure) são aplicadas diretamente no cluster via
# `kubectl create secret ... | kubectl apply -f -`, fora do Git, porque são
# credenciais ativas e este repositório é público (o GitHub Push Protection
# bloqueia esse tipo de commit). O ApplicationSet ignora diffs nesse Secret
# (ver applicationsets/apps-appset.yaml) para o ArgoCD não reverter os
# valores reais aplicados via kubectl.
apiVersion: v1
kind: Secret
metadata:
  name: azure-secrets
  namespace: togglemaster-analytics
type: Opaque
stringData:
  servicebus-connection-string: "PLACEHOLDER_APPLICADO_VIA_KUBECTL_FORA_DO_GIT"
  cosmosdb-connection-string: "PLACEHOLDER_APPLICADO_VIA_KUBECTL_FORA_DO_GIT"
