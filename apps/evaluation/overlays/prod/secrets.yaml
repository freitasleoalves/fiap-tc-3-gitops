# ATENÇÃO: redis-secrets e azure-secrets NÃO são gerenciados por este arquivo.
# As chaves reais do Redis/Service Bus (Azure) são aplicadas diretamente no
# cluster via `kubectl create secret ... | kubectl apply -f -`, fora do Git,
# porque são credenciais ativas e este repositório é público (o GitHub Push
# Protection bloqueia esse tipo de commit). O ApplicationSet ignora diffs
# nesses dois Secrets (ver applicationsets/apps-appset.yaml) para o ArgoCD
# não reverter os valores reais aplicados via kubectl.
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: togglemaster-evaluation
type: Opaque
stringData:
  redis-url: "PLACEHOLDER_APPLICADO_VIA_KUBECTL_FORA_DO_GIT"
---
apiVersion: v1
kind: Secret
metadata:
  name: azure-secrets
  namespace: togglemaster-evaluation
type: Opaque
stringData:
  servicebus-connection-string: "PLACEHOLDER_APPLICADO_VIA_KUBECTL_FORA_DO_GIT"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: togglemaster-evaluation
type: Opaque
stringData:
  service-api-key: "tm_key_service_internal_dev"
