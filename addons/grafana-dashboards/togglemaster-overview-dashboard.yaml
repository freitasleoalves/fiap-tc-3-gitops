apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  togglemaster-overview.json: |
    {
      "title": "ToggleMaster - Overview",
      "uid": "togglemaster-overview",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["togglemaster", "fase4"],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Saúde do Cluster (Kubernetes / AKS)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "CPU por nó (%)",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100 },
            "overrides": []
          },
          "targets": [
            {
              "expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Memória por nó (%)",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0, "max": 100 },
            "overrides": []
          },
          "targets": [
            {
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Restarts de pods (togglemaster-*) na última 1h",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "fieldConfig": {
            "defaults": { "unit": "short" },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"togglemaster-.*\"}[1h]))"
            }
          ]
        },
        {
          "id": 10,
          "type": "row",
          "title": "Microsserviços ToggleMaster (via OTel Collector)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Taxa de requisições por serviço (req/s)",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "fieldConfig": {
            "defaults": { "unit": "reqps" },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (service_name) (rate(togglemaster_http_requests_total[1m]))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Taxa de erros 5xx por serviço (%)",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "fieldConfig": {
            "defaults": { "unit": "percent", "min": 0 },
            "overrides": []
          },
          "targets": [
            {
              "expr": "100 * sum by (service_name) (rate(togglemaster_http_requests_total{http_status_code=~\"5..\"}[1m])) / sum by (service_name) (rate(togglemaster_http_requests_total[1m]))",
              "legendFormat": "{{service_name}}"
            }
          ]
        },
        {
          "id": 20,
          "type": "row",
          "title": "Logs em Tempo Real (Loki)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 }
        },
        {
          "id": 21,
          "type": "logs",
          "title": "Logs dos microsserviços (togglemaster-*)",
          "datasource": "Loki",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 19 },
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "expr": "{k8s_namespace_name=~\"togglemaster-.*\"}"
            }
          ]
        }
      ]
    }
