# ToggleMaster - OTel Collector (Gateway)
#
# Peça central de telemetria: os 5 microsserviços enviam traces, métricas e
# logs de aplicação via OTLP (gRPC :4317 / HTTP :4318) para este Collector,
# que enriquece os dados com metadados do Kubernetes e os roteia para os
# backends corretos:
#   - métricas  -> Prometheus (kube-prometheus-stack), via remote-write
#   - logs      -> Loki, via OTLP nativo
#   - traces    -> Datadog APM, via exporter datadog nativo

mode: deployment

replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.156.0"

# Injeta metadados de Pod/Namespace/Deployment em tudo que passa pelo
# Collector (processor k8sattributes) e cuida do RBAC necessário.
presets:
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true

extraEnvsFrom:
  - secretRef:
      name: datadog-api-key

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    cpu: 500m
    memory: 400Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}
    # k8sattributes é injetado automaticamente pelo preset kubernetesAttributes.

  exporters:
    # Métricas de aplicação (togglemaster_*, http.*) -> Prometheus, via
    # remote-write. O Prometheus já roda com enableRemoteWriteReceiver: true.
    prometheusremotewrite:
      endpoint: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
      resource_to_telemetry_conversion:
        enabled: true

    # Logs de aplicação -> Loki, via endpoint OTLP nativo do Loki.
    otlphttp/loki:
      endpoint: "http://loki.monitoring.svc.cluster.local:3100/otlp"
      tls:
        insecure: true

    # Traces -> Datadog APM (Distributed Tracing + Service Map).
    datadog:
      api:
        key: ${env:DD_API_KEY}
        site: datadoghq.com

  service:
    telemetry:
      logs:
        level: info
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [datadog]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [prometheusremotewrite]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/loki]

service:
  type: ClusterIP
