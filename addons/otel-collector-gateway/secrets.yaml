# ATENÇÃO: este valor NÃO é gerenciado por este arquivo. A API Key real do
# Datadog é aplicada diretamente no cluster via
# `kubectl create secret ... | kubectl apply -f -`, fora do Git, porque é
# uma credencial ativa e este repositório é público (o GitHub Push
# Protection bloqueia esse tipo de commit). O ApplicationSet
# (applicationsets/addons.yaml) ignora diffs nesse Secret para o ArgoCD não
# reverter o valor real aplicado via kubectl.
apiVersion: v1
kind: Secret
metadata:
  name: datadog-api-key
  namespace: monitoring
type: Opaque
stringData:
  DD_API_KEY: "PLACEHOLDER_APPLICADO_VIA_KUBECTL_FORA_DO_GIT"
