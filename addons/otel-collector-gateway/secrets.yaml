# ATENÇÃO: substitua o placeholder abaixo pela sua API Key real do Datadog
# (Organization Settings > API Keys) antes de sincronizar este Application
# no ArgoCD. Sem isso, o exporter "datadog" do OTel Collector não conseguirá
# autenticar e os traces não chegarão no APM.
apiVersion: v1
kind: Secret
metadata:
  name: datadog-api-key
  namespace: monitoring
type: Opaque
stringData:
  DD_API_KEY: "REPLACE_WITH_YOUR_DATADOG_API_KEY"
